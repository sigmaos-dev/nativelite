<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets the text in your browser tab -->
    <title>Sigma OS</title>

    <style>
        /* Removes all white borders and forces dark theme */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0b0f17; 
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Makes your target site take up the exact, seamless full page */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Direct, full-page embedded application view -->
    <iframe src="https://sigmaos.base44.app"></iframe>

</body>
</html>
